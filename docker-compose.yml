services:
  postgres:
    image: postgres:16-alpine
    container_name: order-processing-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ORDER_DB_NAME: ${ORDER_DB_NAME}
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-multiple-db.sh:/docker-entrypoint-initdb.d/init-multiple-db.sh

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: order-processing-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data: